<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Koala · Devtools composition studies</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#ebebed;color:#18181b;font:13px/1.5 -apple-system,BlinkMacSystemFont,sans-serif}button,input{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:2;background:#fafafa;border-bottom:1px solid #c8c8cd;padding:16px 28px;display:flex;align-items:center;gap:24px}h1{font-size:16px;line-height:1.3;margin:0;font-weight:600}header p{margin:2px 0 0;color:#4e4e56;font-size:12px}nav{display:flex;gap:4px;margin-left:auto}nav button{border:0;background:transparent;padding:8px 14px;border-radius:6px;color:#4e4e56}nav button[aria-pressed=true]{background:#dedee1;color:#18181b;font-weight:600}button:focus-visible{outline:2px solid #0e8f80;outline-offset:2px}main{max-width:1320px;margin:auto;padding:24px 28px 32px}.intro{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}.intro h2{font-size:20px;letter-spacing:-.02em;margin:0}.intro p{margin:4px 0 0;color:#4e4e56}.annotation{color:#6c6c75;font-size:12px}.window{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);color:var(--text);margin-bottom:20px;--bg:#fafafa;--well:#ebebed;--hover:#dedee1;--line:#dedee1;--text:#18181b;--muted:#4e4e56;--tertiary:#6c6c75;--accent:#0b7a6d;--error:#d1343a;--warn:#946000}.window.dark{--bg:#1e1e21;--well:#18181b;--hover:#303035;--line:#303035;--text:#f4f4f5;--muted:#a6a6ae;--tertiary:#8a8a93;--accent:#2cc3ae;--error:#f2555a;--warn:#f5a524}.mono,code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}.titlebar{height:36px;display:flex;align-items:center;padding:0 14px;gap:16px;background:var(--well);border-bottom:1px solid var(--line);font-size:12px}.lights{display:flex;gap:7px}.lights i{height:10px;width:10px;border-radius:50%;background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}.titlebar .address{color:var(--muted)}.titlebar .right{margin-left:auto;color:var(--tertiary)}.page{height:110px;display:flex;justify-content:space-between;align-items:center;padding:20px 32px;background:white;color:#18181b}.page strong{font-size:19px;font-weight:600}.page p{color:#6c6c75;margin:2px 0 0}.page .order{border-top:1px solid #dedee1;padding:8px 0;font-size:12px;min-width:250px}.page .order span{float:right}.panel-header{height:38px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:3px;padding:0 10px}.tab{padding:4px 10px;color:var(--muted);font-size:12px;border-radius:5px;white-space:nowrap}.tab.active{background:var(--hover);color:var(--text);font-weight:600}.count{font:11px ui-monospace,SFMono-Regular,monospace;color:var(--error);margin-left:4px}.target{margin-left:auto;font-size:11px;color:var(--tertiary);display:flex;gap:10px;align-items:center}.icon{width:25px;height:25px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;color:var(--muted)}svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.toolbar{height:38px;padding:0 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted)}.search{display:flex;gap:6px;align-items:center;height:25px;width:230px;background:var(--well);border-radius:5px;padding:0 8px;color:var(--tertiary)}.pill{background:var(--hover);border-radius:4px;padding:3px 7px;color:var(--text)}.spacer{flex:1}.tick{width:11px;height:11px;border:1px solid var(--tertiary);border-radius:3px;display:inline-block;vertical-align:-1px;margin-right:5px}.tool-action{color:var(--muted)}.capture{color:var(--accent);font-weight:600}.capture:before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:6px}.content{display:flex;min-height:216px}.list{min-width:0;flex:1}.detail{width:40%;border-left:1px solid var(--line);padding:13px 16px;min-width:0}.detail-title{font-size:12px;font-weight:600;display:flex;gap:8px;align-items:center;margin-bottom:8px}.detail-title .copy{margin-left:auto;font-size:11px;color:var(--muted);font-weight:400}.error{color:var(--error)}.warning{color:var(--warn)}.row{height:29px;display:flex;align-items:center;gap:9px;padding:0 12px;border-bottom:1px solid var(--line);font-size:12px}.row .time{font-size:10px;color:var(--tertiary);width:82px;flex-shrink:0}.row .message{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .source{font-size:10px;color:var(--tertiary);margin-left:auto;white-space:nowrap}.selected{background:var(--hover)}.repeat{font:10px ui-monospace,monospace;padding:0 5px;background:var(--well);border-radius:4px}.prompt{display:flex;align-items:center;height:34px;padding:0 12px;border-top:1px solid var(--line);gap:10px;font-size:12px}.prompt .chev{color:var(--accent);font-size:17px}.prompt .hint{margin-left:auto;color:var(--tertiary);font:10px -apple-system,sans-serif}.foot{height:25px;display:flex;align-items:center;padding:0 12px;border-top:1px solid var(--line);color:var(--tertiary);font-size:10px;gap:12px}.detail .location{font-size:11px;color:var(--muted);margin-bottom:10px}.stack{font-size:11px;line-height:1.8;white-space:pre-wrap;margin:0 0 10px;color:var(--muted)}.kv{border-top:1px solid var(--line);padding-top:8px;font-size:11px}.kv span{color:var(--muted);margin-right:12px}.tabs-mini{display:flex;gap:16px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:9px}.tabs-mini b{font-weight:500;color:var(--text)}pre.json{font-size:12px;line-height:1.7;margin:0;white-space:pre-wrap}.json .key{color:var(--text)}.json .value{color:var(--muted)}.table-head{color:var(--tertiary);font-size:10px;height:25px}.req{display:grid;grid-template-columns:48px minmax(160px,1fr) 45px 65px 56px;gap:12px}.req span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.req span:nth-last-child(-n+3){text-align:right}.req .method{font-size:10px;color:var(--muted)}.response-status{display:flex;gap:9px;align-items:center;font-size:11px;color:var(--muted);margin-bottom:13px}.stacked .content{flex-direction:column;min-height:216px}.stacked .detail{width:auto;border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:12px 16px}.stacked .list .row:nth-child(n+5){display:none}.stacked .detail .detail-title{margin-bottom:5px}.stacked .detail .stack{margin-bottom:0}.stacked .network .list .row:nth-child(n+5){display:none}.reading .list{flex:none;width:34%}.reading .detail{width:66%;padding:16px 22px}.reading .console .row .time,.reading .row .source{display:none}.reading .console .row{height:36px}.reading .req{grid-template-columns:40px minmax(80px,1fr) 34px;gap:8px}.reading .req span:nth-child(n+4){display:none}.reading .detail .stack{line-height:1.9}.reading .detail .json{font-size:13px}.variant{display:none}.variant.visible{display:block}.legend{display:flex;gap:28px;color:#4e4e56;font-size:12px}.legend b{color:#18181b;font-weight:600}@media(max-width:800px){header{padding:12px;gap:12px;flex-wrap:wrap}nav{margin:0}main{padding:16px 12px}.target .host{display:none}.row .source{display:none}.detail{width:45%}.toolbar{gap:7px}.search{width:160px}.req{grid-template-columns:40px minmax(80px,1fr) 35px}.req span:nth-child(n+4){display:none}.intro{display:block}.annotation{margin-top:8px}.page{height:90px;padding:16px}.page .order{min-width:180px}.legend{gap:12px;flex-wrap:wrap}}
</style>
<header><div><h1>Koala devtools</h1><p>Composition studies · illustrative data · native controls in the final app</p></div><nav aria-label="Composition"><button data-view="split" aria-pressed="true">A · Split inspector</button><button data-view="stacked" aria-pressed="false">B · Stacked details</button><button data-view="reading" aria-pressed="false">C · Reading pane</button></nav></header>
<main id="main"></main>
<script>
const icons={detach:'<path d="M9 2h5v5M14 2L7 9"/><path d="M6 3H2v11h11v-4"/>',close:'<path d="M3 3l10 10M13 3L3 13"/>',search:'<circle cx="6.5" cy="6.5" r="4.5"/><path d="M10 10l4 4"/>',copy:'<rect x="5" y="5" width="9" height="9" rx="1"/><path d="M10 5V2H2v8h3"/>'};
const icon=n=>'<span class="icon"><svg viewBox="0 0 16 16" aria-hidden="true">'+icons[n]+'</svg></span>';
const lights='<span class="lights"><i></i><i></i><i></i></span>';
function tabs(active){return '<div class="panel-header">'+['Console','Network','Elements','Storage','Page'].map(x=>'<span class="tab '+(x===active?'active':'')+'">'+x+(x==='Console'?'<span class="count">3</span>':'')+'</span>').join('')+'<span class="target"><span class="host mono">localhost:3000</span>'+icon('detach')+icon('close')+'</span></div>'}
const logRows=[['10:42:18.204','error','TypeError: Cannot read properties of undefined','cart.tsx:42','3'],['10:42:18.205','','Checkout failed','checkout.ts:87',''],['10:42:17.891','warning','Shipping address is missing','validate.ts:16',''],['10:42:17.430','','POST /api/checkout → 422','api.ts:24',''],['10:42:16.110','','Cart loaded · 3 items','cart.ts:18',''],['10:42:15.802','','[vite] connected','client:733','']];
function logs(){return logRows.map((r,i)=>'<div class="row '+(i===0?'selected':'')+'"><span class="time mono">'+r[0]+'</span><span class="'+r[1]+'">'+(r[1]==='error'?'×':r[1]==='warning'?'!':'›')+'</span><span class="message mono">'+r[2]+'</span>'+(r[4]?'<span class="repeat">'+r[4]+'</span>':'')+'<span class="source mono">'+r[3]+'</span></div>').join('')}
function consolePane(){return tabs('Console')+'<div class="toolbar"><span class="search">'+icon('search')+'Search messages</span><span class="pill">All levels</span><span class="spacer"></span><span><i class="tick"></i>Preserve log</span><span class="tool-action">Clear</span></div><div class="content console"><div class="list">'+logs()+'</div><div class="detail"><div><div class="detail-title"><span class="error">TypeError</span><span class="copy">Copy error</span></div><div class="location mono">Cannot read properties of undefined (reading \'total\')</div><pre class="stack">at CartSummary (cart.tsx:42:18)\nat renderWithHooks (react-dom.js:15486:18)\nat updateFunctionComponent (react-dom.js:19617:20)</pre></div><div class="kv"><span>Arguments</span><code>▾ { cart: undefined, items: 3 }</code><div style="margin-top:9px;color:var(--tertiary)">Repeated 3 times · first seen 10:42:18.204</div></div></div></div><div class="prompt mono"><span class="chev">›</span>cart.items.length<span class="hint">Enter to evaluate · Shift Enter for a new line</span></div><div class="foot"><span>6 messages</span><span class="error">3 errors</span><span class="spacer"></span><span>Following latest</span></div>'}
const requests=[['POST','/api/checkout','422','1.2 KB','184 ms'],['GET','/api/cart','200','2.8 KB','42 ms'],['GET','/api/products?limit=20','200','8.1 KB','67 ms'],['GET','/api/shipping/options','200','940 B','31 ms'],['POST','/api/events','204','0 B','18 ms'],['GET','/api/user','200','1.1 KB','29 ms']];
function network(){return tabs('Network')+'<div class="toolbar"><span class="pill">Fetch / XHR</span><span>Resources</span><span class="search">'+icon('search')+'Search requests</span><span class="spacer"></span><span class="capture">Capture on</span><span class="tool-action">Clear</span></div><div class="content network"><div class="list"><div class="row req table-head"><span>Method</span><span>Name</span><span>Status</span><span>Size</span><span>Time</span></div>'+requests.map((r,i)=>'<div class="row req mono '+(i===0?'selected':'')+'">'+r.map((v,j)=>'<span class="'+(j===0?'method':i===0&&j===2?'error':'')+'">'+v+'</span>').join('')+'</div>').join('')+'</div><div class="detail"><div><div class="detail-title mono">POST /api/checkout<span class="copy">Copy as cURL</span></div><div class="tabs-mini"><span>Overview</span><span>Headers</span><span>Payload</span><b>Response</b></div><div class="response-status"><span class="error mono">422</span><span>Unprocessable Content</span><span class="spacer"></span><span class="mono">184 ms</span></div></div><div><pre class="json">{\n  <span class="key">"error"</span>: <span class="value">"Missing shipping address"</span>,\n  <span class="key">"field"</span>: <span class="value">"shippingAddress"</span>\n}</pre><div style="font-size:10px;color:var(--tertiary);margin-top:12px">application/json · 76 B · Copy response</div></div></div></div><div class="foot"><span>6 captured requests</span><span class="error">1 failed</span><span class="spacer"></span><span>Capture stops when tools close or the origin changes</span></div>'}
const variants={split:['A · Split inspector','Keep the event list and selected details side by side.','Balanced scanning','A familiar, resizable split keeps surrounding events visible.'],stacked:['B · Stacked details','Give long messages and responses the full width.','Wide content','A detail tray sits below the list, trading list height for reading width.'],reading:['C · Reading pane','Use a compact event rail with a generous reading area.','Focused investigation','More space for stacks, headers, and JSON; fewer columns in the list.']};
function render(key){const v=variants[key];document.getElementById('main').innerHTML='<section class="'+key+'"><div class="intro"><div><h2>'+v[0]+'</h2><p>'+v[1]+'</p></div><span class="annotation">Same toolkit, different space allocation</span></div><div class="window"><div class="titlebar">'+lights+'<span class="address mono">localhost:3000/checkout</span><span class="right">Bottom dock · light appearance</span></div><div class="page"><div><strong>Checkout</strong><p>Complete your order</p></div><div class="order">3 items<span>$128.00</span></div></div>'+consolePane()+'</div><div class="window dark"><div class="titlebar">'+lights+'<span>Checkout · localhost:3000</span><span class="right">Detached window · dark appearance</span></div>'+network()+'</div><div class="legend"><span><b>'+v[2]+'</b> · '+v[3]+'</span><span>Five tool tabs · keyboard access · explicit capture</span></div></section>';for(const b of document.querySelectorAll('nav button'))b.setAttribute('aria-pressed',String(b.dataset.view===key));history.replaceState(null,'','#'+key)}
for(const b of document.querySelectorAll('nav button'))b.onclick=()=>render(b.dataset.view);render(variants[location.hash.slice(1)]?location.hash.slice(1):'split');
</script>
</html>
