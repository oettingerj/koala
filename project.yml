name: Nano
options:
  bundleIdPrefix: com.joshoettinger
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
packages:
  BrowserKit:
    path: Packages/BrowserKit
targets:
  Nano:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: BrowserKit
    info:
      path: App/Info.plist
      properties:
        CFBundleName: $(NANO_DISPLAY_NAME)
        CFBundleDisplayName: $(NANO_DISPLAY_NAME)
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "26.0"
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        LSFileQuarantineEnabled: true
        NSCameraUsageDescription: Websites you allow can use your camera, for example for video calls.
        NSMicrophoneUsageDescription: Websites you allow can use your microphone, for example for calls and recordings.
        CFBundleURLTypes:
          - CFBundleURLName: Web site URL
            CFBundleURLSchemes: [http, https]
        CFBundleDocumentTypes:
          - CFBundleTypeName: HTML document
            CFBundleTypeRole: Viewer
            LSItemContentTypes: [public.html, public.xhtml]
    entitlements:
      path: App/Nano.entitlements
      properties:
        # Not sandboxed: like Chrome, Nano launches extensions' native messaging hosts, and a
        # sandboxed app's child processes inherit its sandbox. The hardened runtime still applies.
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joshoettinger.nano
        PRODUCT_NAME: Nano
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        NANO_DISPLAY_NAME: Nano
      configs:
        # Debug builds get their own bundle ID, so their sandbox container, defaults,
        # Keychain item, and Launch Services entry stay apart from the installed Release app.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.joshoettinger.nano.dev
          NANO_DISPLAY_NAME: Nano Dev
schemes:
  Nano:
    build:
      targets:
        Nano: all
    run:
      config: Debug
    test:
      config: Debug
