name: Koala
options:
  bundleIdPrefix: com.joshoettinger
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
packages:
  BrowserKit:
    path: Packages/BrowserKit
targets:
  Koala:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: BrowserKit
    info:
      path: App/Info.plist
      properties:
        CFBundleName: $(KOALA_DISPLAY_NAME)
        CFBundleDisplayName: $(KOALA_DISPLAY_NAME)
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "26.0"
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        LSFileQuarantineEnabled: true
        NSCameraUsageDescription: Websites you allow can use your camera, for example for video calls.
        NSMicrophoneUsageDescription: Websites you allow can use your microphone, for example for calls and recordings.
        CFBundleURLTypes:
          - CFBundleURLName: Web site URL
            CFBundleURLSchemes: [http, https]
        CFBundleDocumentTypes:
          - CFBundleTypeName: HTML document
            CFBundleTypeRole: Viewer
            LSItemContentTypes: [public.html, public.xhtml]
    entitlements:
      path: App/Koala.entitlements
      properties:
        # Not sandboxed: like Chrome, Koala launches extensions' native messaging hosts, and a
        # sandboxed app's child processes inherit its sandbox. The hardened runtime still applies.
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joshoettinger.koala
        PRODUCT_NAME: Koala
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # A stable signature: macOS keeps Koala's data, Keychain items, and permissions across rebuilds.
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: B9XC6ZD8WD
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        KOALA_DISPLAY_NAME: Koala
      configs:
        # Release is signed with Developer ID: 1Password's helper only talks to browsers whose leaf
        # certificate is Developer ID or Mac App Store (never Apple Development, whatever the custom
        # browser list says). Create the certificate in Xcode > Settings > Accounts > Manage
        # Certificates. Developer ID signing also leaves out get-task-allow, so nothing can attach
        # a debugger to the installed browser.
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: CXWKXPU9U5
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        # Debug builds get their own bundle ID and name, so their data folder, defaults,
        # Keychain item, and Launch Services entry stay apart from the installed Release app.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.joshoettinger.koala.dev
          KOALA_DISPLAY_NAME: Koala Dev
schemes:
  Koala:
    build:
      targets:
        Koala: all
    run:
      config: Debug
    test:
      config: Debug
